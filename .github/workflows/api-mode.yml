name: (선택) API로 직접 수집·요약

# 기본 운영은 Claude 예약 작업(ops/morning-edition.md)이 합니다.
# 이 워크플로는 Claude API 키(ANTHROPIC_API_KEY)를 등록한 경우에만 수동으로 쓰는 예비 방식이에요.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 뉴스 수집·요약
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scraper.run
      - name: 결과 커밋
        run: |
          git config user.name "easynews-bot"
          git config user.email "easynews-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "뉴스 업데이트 $(TZ=Asia/Seoul date +%F)"
          git push
